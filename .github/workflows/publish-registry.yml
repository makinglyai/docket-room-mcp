name: Publish to the MCP Registry

# Publishes server.json to registry.modelcontextprotocol.io whenever it changes
# on main. Signs in with GitHub's OIDC token, so there is no secret to store and
# no device code to approve. The registry rejects a version it already has, so
# bump "version" in server.json with every change.
on:
  push:
    branches: [main]
    paths: [server.json]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.16/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Sign in with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish
        run: ./mcp-publisher publish
      - name: Confirm the registry serves this version
        # The registry takes a few seconds to mark a new version as latest.
        run: |
          want=$(jq -r .version server.json)
          for i in 1 2 3 4 5 6; do
            got=$(curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.makinglyai/docket-room&version=latest" \
              | jq -r '.servers[0].server.version')
            echo "want=$want got=$got"
            [ "$want" = "$got" ] && exit 0
            sleep 10
          done
          exit 1
